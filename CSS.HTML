<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fa;
}

/* ==========================
   CONTAINER
========================== */

.container{
    max-width:420px;
    margin:auto;
    background:#fff;
    min-height:100vh;
}

/* ==========================
   HEADER
========================== */

.header{
    background:#FFC72C;
    color:#0A8F83;
    text-align:center;
    padding:20px;
}

.header h1{
    font-size:28px;
    font-weight:bold;
}

.header p{
    margin-top:6px;
    color:#444;
    font-size:14px;
}

/* ==========================
   SEARCH
========================== */

.search-box{
    display:flex;
    gap:10px;
    padding:15px;
    background:#fff;
}

.search-box input{

    flex:1;

    height:46px;

    border:1px solid #ddd;

    border-radius:25px;

    padding:0 18px;

    font-size:15px;

    outline:none;

}

.search-box button{

    width:46px;

    height:46px;

    border:none;

    border-radius:50%;

    background:#0066cc;

    color:white;

    cursor:pointer;

    font-size:18px;

}

/* ==========================
   TOOLBAR
========================== */

.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 15px 15px;

}

#btnFilter{

    background:#0066cc;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

}

.counter{

    color:#666;

    font-size:14px;

}

/* ==========================
   LIST
========================== */

.list-container{

    padding:15px;

}

#loading{

    text-align:center;

    color:#777;

    padding:30px;

}

.list-card{

    background:#fff;

    border:1px solid #e5e5e5;

    border-radius:12px;

    padding:15px;

    margin-bottom:15px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.location-name{

    font-size:17px;

    font-weight:bold;

    margin-bottom:8px;

}

.location-address{

    color:#666;

    font-size:14px;

    line-height:22px;

}

.location-type{

    display:inline-block;

    margin-top:10px;

    background:#eaf3ff;

    color:#0066cc;

    padding:5px 12px;

    border-radius:20px;

    font-size:12px;

}

.location-footer{

    margin-top:15px;

    text-align:right;

}

.location-footer a{

    background:#0066cc;

    color:white;

    padding:8px 15px;

    text-decoration:none;

    border-radius:8px;

    display:inline-block;

}

/* ==========================
   FILTER MODAL
========================== */

.modal{

    display:none;

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,.35);

    z-index:999;

}

.modal-content{

    background:white;

    width:90%;

    max-width:350px;

    margin:80px auto;

    padding:20px;

    border-radius:12px;

}

.modal h3{

    margin-bottom:15px;

}

.modal select{

    width:100%;

    height:42px;

    margin-bottom:12px;

    border:1px solid #ddd;

    border-radius:8px;

    padding:0 10px;

}

.button-group{

    display:flex;

    gap:10px;

}

.button-group button{

    flex:1;

    height:42px;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

#applyFilter{

    background:#0066cc;

    color:white;

}

#resetFilter{

    background:#888;

    color:white;

}

#closeFilter{

    background:#e53935;

    color:white;

}

/* ==========================
   MOBILE
========================== */

@media(max-width:480px){

.header h1{

    font-size:22px;

}

}

</style>
