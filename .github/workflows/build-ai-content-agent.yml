name: Build AI Content Agent APK

on:
  push:
    branches:
      - android-ai-agent-build
    paths:
      - "AndroidAIContentAgent/**"
      - ".github/workflows/build-ai-content-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 17 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept licenses and install Android 17 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK (retry transient Maven rate limits)
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if gradle --no-daemon --stacktrace -p AndroidAIContentAgent :app:assembleDebug 2>&1 | tee "gradle-build-$attempt.log"; then
              exit 0
            fi
            if grep -q "429" "gradle-build-$attempt.log"; then
              echo "Maven rate limit detected; waiting before retry..."
              sleep 45
            else
              exit 1
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Agent-APK
          path: AndroidAIContentAgent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
