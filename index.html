<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>YOYI! Location</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div>

                <div class="brand-title">
                    YOYI! LOCATION
                </div>

                <div class="brand-subtitle">
                    Smart Locker & Storage Network
                </div>

            </div>

        </div>

    </header>


    <!-- SEARCH -->

    <div class="search-area">

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="search"
                placeholder="Cari lokasi...">

            <button
                id="clearSearch"
                class="clear-btn">

                ×

            </button>

        </div>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <button
            id="btnFilter"
            class="filter-btn">

            ⚙ Filter

        </button>


        <div class="counter">

            <strong id="total">
                0
            </strong>

            Lokasi

        </div>

    </div>


    <!-- FILTER MODAL -->

    <div
        id="filterModal"
        class="filter-modal"
        hidden>

        <div class="filter-box">


            <div class="filter-header">

                <strong>
                    Filter Lokasi
                </strong>

                <button
                    id="closeFilter">

                    ×

                </button>

            </div>


            <select id="provinsi">

                <option value="">
                    Semua Provinsi
                </option>

            </select>


            <select id="kota">

                <option value="">
                    Semua Kota
                </option>

            </select>


            <select id="kecamatan">

                <option value="">
                    Semua Kecamatan
                </option>

            </select>


            <select id="tipe">

                <option value="">
                    Semua Tipe
                </option>

            </select>


            <div class="filter-actions">

                <button
                    id="resetFilter"
                    class="reset-btn">

                    Reset

                </button>


                <button
                    id="applyFilter"
                    class="apply-btn">

                    Terapkan

                </button>

            </div>


        </div>

    </div>


    <!-- CONTENT -->

    <main class="content">


        <div class="list-title">

            Daftar Lokasi

        </div>


        <div
            id="loading"
            class="loading">

            Mengambil data...

        </div>


        <div
            id="list"
            class="location-list">
        </div>


        <div
            id="empty"
            class="empty"
            hidden>

            Lokasi tidak ditemukan.

        </div>


    </main>


</div>


<script src="script.js"></script>


</body>

</html>
